[package]
name = "ingressd-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# The fuzz crate is its own workspace (excluded from the main one) and requires
# the nightly toolchain: run with `cargo +nightly fuzz run <target>`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ingressd-core = { path = "../crates/ingressd-core" }

[[bin]]
name = "decode_frame"
path = "fuzz_targets/decode_frame.rs"
test = false
doc = false

[[bin]]
name = "parse_dns"
path = "fuzz_targets/parse_dns.rs"
test = false
doc = false

[[bin]]
name = "pcap_reader"
path = "fuzz_targets/pcap_reader.rs"
test = false
doc = false
